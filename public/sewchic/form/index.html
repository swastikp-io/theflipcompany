<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEWCHIC</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: #080808;
      background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('heroed.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      /* Hide scrollbars for single page feel */
    }

    #progress-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: #222;
      z-index: 10;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: #e21e1e;
      transition: width 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #form-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .question-slide {
      position: absolute;
      width: 100%;
      max-width: 760px;
      padding: 0 40px;
      box-sizing: border-box;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1), transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .slide-hidden-down {
      transform: translateY(60px);
    }

    .slide-active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .slide-hidden-up {
      transform: translateY(-60px);
    }

    .question-text {
      font-size: 2.2rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 40px;
      display: flex;
      align-items: flex-start;
      letter-spacing: -0.02em;
    }

    .question-number {
      color: #e21e1e;
      font-size: 1.4rem;
      font-weight: 500;
      margin-right: 15px;
      margin-top: 5px;
    }

    .input-text {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 2.2rem;
      font-weight: 500;
      padding: 15px 0;
      outline: none;
      width: 100%;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      font-family: inherit;
      letter-spacing: -0.01em;
    }

    .input-text:focus {
      border-bottom: 1px solid #e21e1e;
      box-shadow: 0 4px 0 -3px rgba(226, 30, 30, 0.5);
      /* subtle glow */
    }

    .input-text::placeholder {
      color: rgba(255, 255, 255, 0.25);
      font-weight: 400;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 500;
      padding: 16px 20px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      align-items: center;
      font-family: inherit;
      letter-spacing: -0.01em;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .option-btn .key-hint {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 0.8rem;
      width: 24px;
      height: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 4px;
      margin-right: 15px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .option-btn:hover,
    .option-btn:focus {
      background: rgba(226, 30, 30, 0.15);
      border-color: rgba(226, 30, 30, 0.5);
      outline: none;
      transform: translateX(4px);
    }

    .option-btn:hover .key-hint,
    .option-btn:focus .key-hint {
      background: #e21e1e;
      color: #fff;
    }

    .option-btn.selected {
      background: rgba(226, 30, 30, 0.25);
      border-color: #e21e1e;
    }

    .option-btn.selected .key-hint {
      background: #e21e1e;
      color: #fff;
    }

    .nav-hint {
      margin-top: 40px;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-hint kbd {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .btn-next {
      background: #e21e1e;
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.1s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.01em;
    }

    .btn-next:hover {
      background: #f02525;
    }

    .btn-next:active {
      transform: scale(0.97);
    }

    .error-msg {
      color: #ff4545;
      font-size: 1rem;
      font-weight: 500;
      margin-top: 15px;
      opacity: 0;
      transition: opacity 0.3s;
      background: rgba(255, 69, 69, 0.15);
      padding: 10px 15px;
      border-radius: 6px;
      display: inline-block;
      align-self: flex-start;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .show-error .error-msg {
      opacity: 1;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-8px);
      }

      75% {
        transform: translateX(8px);
      }
    }

    .shake {
      animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
    }

    /* Checkmark Animation for Thank You Screen */
    .checkmark {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      display: block;
      stroke-width: 3;
      stroke: #e21e1e;
      stroke-miterlimit: 10;
      box-shadow: inset 0px 0px 0px #e21e1e;
      animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
      margin: 0 auto 40px;
    }

    .checkmark__circle {
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      stroke-width: 3;
      stroke-miterlimit: 10;
      stroke: #e21e1e;
      fill: none;
      animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }

    .checkmark__check {
      transform-origin: 50% 50%;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
    }

    @keyframes stroke {
      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes scale {

      0%,
      100% {
        transform: none;
      }

      50% {
        transform: scale3d(1.15, 1.15, 1);
      }
    }

    @keyframes fill {
      100% {
        box-shadow: inset 0px 0px 0px 30px rgba(226, 30, 30, 0.05);
      }
    }

    .thank-you-title {
      font-size: 3.5rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 15px;
      letter-spacing: -0.03em;
    }

    .thank-you-sub {
      font-size: 1.3rem;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .cover-container {
      text-align: left;
      margin-bottom: 30px;
      max-width: 700px;
    }

    .cover-headline {
      font-size: 5.5rem;
      font-weight: 800;
      margin-bottom: 15px;
      line-height: 1;
      letter-spacing: -0.04em;
      color: #fff;
      text-transform: uppercase;
    }

    .cover-sub {
      font-size: 1.8rem;
      color: rgba(255, 255, 255, 0.95);
      font-weight: 600;
      margin-bottom: 25px;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    .cover-body {
      font-size: 1.3rem;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
      line-height: 1.6;
      white-space: pre-line;
      letter-spacing: -0.01em;
    }

    @media (max-width: 768px) {

      body,
      html {
        background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('IMG_8476.jpg');
      }

      .cover-headline {
        font-size: 3.2rem;
        margin-bottom: 15px;
      }

      .cover-sub {
        font-size: 1.4rem;
        margin-bottom: 20px;
      }

      .cover-body {
        font-size: 1.1rem;
      }

      .question-slide {
        padding: 0 24px;
      }

      .question-text {
        font-size: 1.6rem;
        margin-bottom: 25px;
      }

      .input-text {
        font-size: 1.6rem;
        padding: 10px 0;
      }

      .option-btn {
        font-size: 1.1rem;
        padding: 14px 16px;
      }

      .thank-you-title {
        font-size: 2.5rem;
      }

      .thank-you-sub {
        font-size: 1.1rem;
      }

      .btn-next {
        font-size: 1rem;
        padding: 12px 24px;
      }

      .nav-hint {
        margin-top: 25px;
      }
    }
  </style>
</head>

<body>

  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <div id="form-container">
    <!-- Slides injected via JS -->
  </div>

  <!-- Form submission is handled via Google Apps Script fetch call -->

  <script>
    /**
     * ==========================================
     * FORM SCHEMA & CONFIGURATION
     * ==========================================
     */
    // API endpoint configured in submitForm
    const formConfig = {
      questions: [
        {
          id: "intro",
          type: "cover",
          headline: "THE MALL MOVED IN.",
          sub: "Something is changing in how India shops for clothes. We're not saying what. Not yet. We want your honest read first.",
          body: "Seven questions.\nTwo minutes.\nNo pitch, no reveal."
        },
        {
          id: "1",
          type: "text",
          question: "What is your name?",
          required: true
        },
        {
          id: "2",
          type: "single-select",
          question: "How often do you shop for fashion online?",
          options: ["Weekly", "Monthly", "Rarely"],
          required: true
        },
        {
          id: "3",
          type: "single-select",
          question: "What's the #1 reason you've returned or regretted an online fashion order?",
          options: ["Wrong fit / Different than shown in photos / Not sure how the product is", "Other"],
          required: true
        },
        {
          id: "4",
          type: "single-select",
          question: "Would you pay extra for a delivery option that guarantees the fit is right before you pay?",
          options: ["Yes", "Maybe depends on cost", "No"],
          required: true
        },
        {
          id: "5",
          type: "single-select",
          question: "How much extra would feel reasonable for that?",
          options: ["100", "100 - 150", "100+", "Won't pay extra"],
          required: true
        },
        {
          id: "6",
          type: "single-select",
          question: "How would you feel if every brand's full collection could show up right in your room! in your size!",
          options: ["Would love it", "Amazing", "Nice, not a big deal", "Doesn't matter to me"],
          required: true
        },
        {
          id: "7",
          type: "text",
          question: "Which city are you in?",
          required: true
        }
      ]
    };

    /**
     * ==========================================
     * FORM LOGIC & UI
     * ==========================================
     */
    let currentIndex = 0;
    const answers = {};
    let slides = [];
    let submitted = false;

    const svgCheck = `
      <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
        <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
        <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
      </svg>
    `;

    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById('form-container');

      let questionCounter = 1;

      // Build slides
      formConfig.questions.forEach((q, index) => {
        const slide = document.createElement('div');
        slide.className = 'question-slide ' + (index === 0 ? 'slide-active' : 'slide-hidden-down');

        if (q.type === 'cover') {
          slide.innerHTML = `
            <div class="cover-container">
              <h1 class="cover-headline">${q.headline}</h1>
              <p class="cover-sub">${q.sub}</p>
              <p class="cover-body">${q.body}</p>
            </div>
            <div style="margin-top: 40px; display: flex; align-items: center; gap: 20px;">
              <button class="btn-next" onclick="goToNext()" style="font-size: 1.2rem; padding: 14px 36px; border-radius: 8px;">Start</button>
              <div class="nav-hint" style="margin-top: 0;"><span>press <kbd>Enter</kbd></span></div>
            </div>
          `;
          container.appendChild(slide);
          slides.push(slide);
          return;
        }

        let contentHtml = `
          <div class="question-text">
            <span class="question-number">${questionCounter} &rarr;</span>
            <span>${q.question}${q.required ? '<span style="color:#e21e1e; margin-left:8px;">*</span>' : ''}</span>
          </div>
        `;
        questionCounter++;

        const innerDiv = document.createElement('div');
        innerDiv.innerHTML = contentHtml;
        slide.appendChild(innerDiv);

        if (q.type === 'text') {
          const inputWrapper = document.createElement('div');
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'input-text';
          input.placeholder = 'Type your answer here...';
          input.dataset.qid = q.id;

          input.addEventListener('input', () => {
            if (input.value.trim()) slide.classList.remove('show-error');
          });

          inputWrapper.appendChild(input);
          slide.appendChild(inputWrapper);

          const hint = document.createElement('div');
          hint.className = 'nav-hint';
          hint.innerHTML = `<button class="btn-next" onclick="goToNext()">OK &nbsp;<kbd>Enter</kbd></button> <span>press <kbd>Enter</kbd> to continue</span>`;
          slide.appendChild(hint);

        } else if (q.type === 'single-select' || q.type === 'multi-select') {
          const list = document.createElement('div');
          list.className = 'options-list';
          q.options.forEach((opt, optIdx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span class="key-hint">${optIdx + 1}</span> <span>${opt}</span>`;
            btn.onclick = () => {
              if (q.type === 'single-select') {
                selectOption(index, optIdx);
                setTimeout(goToNext, 400);
              } else {
                toggleOption(index, optIdx);
              }
            };
            list.appendChild(btn);
          });
          slide.appendChild(list);

          if (q.type === 'multi-select') {
            const hint = document.createElement('div');
            hint.className = 'nav-hint';
            hint.innerHTML = `<button class="btn-next" onclick="goToNext()">OK &nbsp;<kbd>Enter</kbd></button> <span>press <kbd>Enter</kbd> to continue</span>`;
            slide.appendChild(hint);
          }
        }

        const errorMsg = document.createElement('div');
        errorMsg.className = 'error-msg';
        slide.appendChild(errorMsg);

        container.appendChild(slide);
        slides.push(slide);
      });

      // Build Thank You Slide
      const tySlide = document.createElement('div');
      tySlide.className = 'question-slide slide-hidden-down';
      tySlide.style.alignItems = 'center';
      tySlide.innerHTML = `
        ${svgCheck}
        <div class="thank-you-title">Thank You</div>
        <div class="thank-you-sub">Your response has been recorded.</div>
      `;
      container.appendChild(tySlide);
      slides.push(tySlide);

      updateProgress();
      focusCurrent();
    });

    function selectOption(qIndex, optIndex) {
      const q = formConfig.questions[qIndex];
      answers[q.id] = q.options[optIndex];

      const slide = slides[qIndex];
      const btns = slide.querySelectorAll('.option-btn');
      btns.forEach((btn, idx) => {
        if (idx === optIndex) btn.classList.add('selected');
        else btn.classList.remove('selected');
      });

      slide.classList.remove('show-error');
    }

    function toggleOption(qIndex, optIndex) {
      const q = formConfig.questions[qIndex];
      if (!Array.isArray(answers[q.id])) {
        answers[q.id] = [];
      }
      
      const optValue = q.options[optIndex];
      const valIndex = answers[q.id].indexOf(optValue);
      
      if (valIndex > -1) {
        answers[q.id].splice(valIndex, 1);
      } else {
        answers[q.id].push(optValue);
      }

      const slide = slides[qIndex];
      const btns = slide.querySelectorAll('.option-btn');
      const btn = btns[optIndex];
      btn.classList.toggle('selected');
      
      slide.classList.remove('show-error');
    }

    function validateSlide(index) {
      if (index >= formConfig.questions.length) return true; // TY slide always valid

      const q = formConfig.questions[index];
      if (q.type === 'cover') return true;

      const slide = slides[index];

      if (q.type === 'text') {
        const input = slide.querySelector('input');
        answers[q.id] = input.value.trim();
        if (q.required && !answers[q.id]) {
          showError(index, 'Please fill this in');
          return false;
        }
      } else if (q.type === 'single-select') {
        if (q.required && !answers[q.id]) {
          showError(index, 'Please select an option');
          return false;
        }
      } else if (q.type === 'multi-select') {
        if (q.required && (!answers[q.id] || answers[q.id].length === 0)) {
          showError(index, 'Please select at least one option');
          return false;
        }
      }
      return true;
    }

    function showError(index, msg) {
      const slide = slides[index];
      slide.classList.add('show-error');

      slide.classList.remove('shake');
      void slide.offsetWidth;
      slide.classList.add('shake');

      const errorEl = slide.querySelector('.error-msg');
      if (errorEl) errorEl.innerText = msg;
    }

    function goToNext() {
      if (currentIndex >= slides.length - 1) return;
      if (!validateSlide(currentIndex)) return;

      slides[currentIndex].className = 'question-slide slide-hidden-up';
      currentIndex++;

      if (currentIndex === slides.length - 1) {
        submitForm();
      }

      slides[currentIndex].className = 'question-slide slide-active';
      updateProgress();
      focusCurrent();
    }

    function goToPrev() {
      if (currentIndex <= 0) return;
      if (currentIndex >= slides.length - 1) return; // Cannot go back from TY slide

      slides[currentIndex].className = 'question-slide slide-hidden-down';
      currentIndex--;
      slides[currentIndex].className = 'question-slide slide-active';
      updateProgress();
      focusCurrent();
    }

    function updateProgress() {
      const totalQuestions = formConfig.questions.filter(q => q.type !== 'cover').length;

      let currentQ = 0;
      for (let i = 0; i < currentIndex; i++) {
        if (formConfig.questions[i].type !== 'cover') {
          currentQ++;
        }
      }

      let percent = (currentQ / totalQuestions) * 100;
      if (currentIndex >= formConfig.questions.length) percent = 100; // at TY screen

      document.getElementById('progress-bar').style.width = percent + '%';
    }

    function focusCurrent() {
      if (currentIndex >= formConfig.questions.length) return;
      const q = formConfig.questions[currentIndex];
      if (q.type === 'text') {
        const input = slides[currentIndex].querySelector('input');
        setTimeout(() => { if (input) input.focus(); }, 300); // wait for slide animation
      }
    }

    function submitForm() {
      console.log("Form submission data:", answers);

      try {
        localStorage.setItem('formResponses_backup', JSON.stringify(answers));
      } catch (e) { console.error("LocalStorage backup failed", e); }

      const payload = {
        name: answers["1"] || "",
        q2: answers["2"] || "",
        q3: answers["3"] || "",
        q4: answers["4"] || "",
        q5: answers["5"] || "",
        q6: answers["6"] || "",
        city: answers["7"] || ""
      };

      fetch("https://script.google.com/macros/s/AKfycbx62CX4aZjOIEQ0zP9Q6lTYsAmoNLCpC2tYTflgAkvy8iGu-XqpSRl_1LFCuxqe94Ru/exec", {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(() => console.log("Submitted successfully"))
      .catch((err) => console.error("Submission failed", err));

      submitted = true;
    }

    // Global keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (currentIndex >= formConfig.questions.length) return; // Block on TY slide

      const isInput = e.target.tagName.toLowerCase() === 'input';

      if (e.key === 'Enter') {
        e.preventDefault();
        if (e.shiftKey) {
          goToPrev();
        } else {
          goToNext();
        }
      } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        if (!isInput) {
          e.preventDefault();
          goToPrev();
        }
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        if (!isInput) {
          e.preventDefault();
          goToNext();
        }
      } else if (/^[1-9]$/.test(e.key)) {
        if (!isInput) {
          const q = formConfig.questions[currentIndex];
          if (q && q.type === 'single-select') {
            const num = parseInt(e.key);
            if (num > 0 && num <= q.options.length) {
              selectOption(currentIndex, num - 1);
              setTimeout(goToNext, 400);
            }
          } else if (q && q.type === 'multi-select') {
            const num = parseInt(e.key);
            if (num > 0 && num <= q.options.length) {
              toggleOption(currentIndex, num - 1);
            }
          }
        }
      }
    });

  </script>
</body>

</html>
